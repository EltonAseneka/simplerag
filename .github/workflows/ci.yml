name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run Test Suite
        run: |
          if ! npm test; then
            OUTPUT=$(npm test 2>&1 | tr '\r\n' ' ')
            echo "::error title=TestSuiteFailed::$OUTPUT"
            exit 1
          fi

      - name: Check Coverage Thresholds (>=70%)
        run: npm run check-coverage
